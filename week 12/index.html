<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Linked List Cart</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Data Structure Visualizer</h1>
    <p class="subtitle">Dynamic Linked List Shopping Cart Implementation</p>
    
    <div class="container">
        <!-- Controls -->
        <div class="glass-panel">
            <h2>Add Item</h2>
            <div class="form-group">
                <label for="itemId">Unique ID</label>
                <input type="number" id="itemId" placeholder="e.g., 101" required>
            </div>
            <div class="form-group">
                <label for="itemName">Item Name</label>
                <input type="text" id="itemName" placeholder="e.g., Gaming Mouse" required>
            </div>
            <div class="form-group">
                <label for="itemPrice">Price (₹)</label>
                <input type="number" id="itemPrice" placeholder="e.g., 49.99" step="0.01" required>
            </div>
            <div class="button-group">
                <button id="addHeadBtn" class="secondary">Insert at Head</button>
                <button id="addTailBtn">Insert at Tail</button>
            </div>
            
            <hr class="divider">
            
            <h2>Remove Item</h2>
            <div class="form-group">
                <label for="removeId">Item ID to Remove</label>
                <input type="number" id="removeId" placeholder="e.g., 101">
            </div>
            <button id="removeBtn" class="danger-btn">Remove by ID</button>
        </div>

        <!-- Rendered Linked List -->
        <div class="glass-panel cart-display">
            <div class="list-container" id="listContainer">
                <div style="color: var(--text-muted); font-weight: 500;">Cart is empty</div>
            </div>
            
            <div class="summary">
                <div class="summary-label">Total List Value</div>
                <div class="summary-value">₹<span id="totalValue">0.00</span></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
