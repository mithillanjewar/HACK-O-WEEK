<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank ATM - Circular Queue System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <svg fill="currentColor" viewBox="0 0 24 24"><path d="M4 10h3v7H4zM10.5 10h3v7h-3zM2 19h20v3H2zM17 10h3v7h-3zM4 6.22V8h16V6.22L12 3z"/></svg>
        <span>Global Prime Bank</span>
      </div>
      <h1>ATM Peak Hour Queue Management</h1>
      <p>Efficient Customer Routing with Circular Queue Architecture</p>
    </header>

    <main class="queue-board">
      <div class="controls-panel">
        <div class="stat-box">
          <span class="stat-label">Queue Size</span>
          <span class="stat-val" id="queue-size-disp">0 / 6</span>
        </div>
        
        <div class="action-buttons">
          <button id="btn-enqueue" class="btn primary">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            Add Customer (Arrival)
          </button>
          <button id="btn-dequeue" class="btn secondary">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            Serve Customer (Dequeue)
          </button>
        </div>
      </div>

      <div class="notifications-area" id="notifications">
        <!-- Toast notifications will appear here -->
      </div>

      <div class="queue-visualization">
        <h2 class="vis-title">Live Queue Status</h2>
        
        <div class="queue-array-container">
          <!-- Pointers -->
          <div class="pointers-layer" id="pointers-layer">
            <div class="pointer hidden" id="ptr-front">Front</div>
            <div class="pointer hidden" id="ptr-rear">Rear</div>
          </div>
          
          <div class="queue-slots" id="queue-slots">
            <!-- Slots will be generated by JS -->
          </div>
        </div>
        
        <div class="queue-status-indicator" id="status-indicator">
          <div class="status-dot"></div>
          <span id="status-text">Ready for Customers</span>
        </div>
      </div>
    </main>

    <!-- Modal for Serving Customer visually -->
    <div id="serve-modal" class="serve-modal hidden">
      <div class="serve-content">
        <div class="icon-pulse">
          <svg viewBox="0 0 24 24" fill="currentColor" width="48" height="48">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
        </div>
        <h3 id="served-customer-name">Customer Served</h3>
        <p>Transaction completed successfully.</p>
      </div>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
