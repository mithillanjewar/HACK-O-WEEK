<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery with Lightbox</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            padding-top: 60px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
        }

        .lightbox img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 10px;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>My Photography Gallery</h1>

<div class="gallery">
    <img src="https://picsum.photos/id/1011/400/300" onclick="openLightbox(this.src)">
    <img src="https://picsum.photos/id/1015/400/300" onclick="openLightbox(this.src)">
    <img src="https://picsum.photos/id/1016/400/300" onclick="openLightbox(this.src)">
    <img src="https://picsum.photos/id/1020/400/300" onclick="openLightbox(this.src)">
    <img src="https://picsum.photos/id/1024/400/300" onclick="openLightbox(this.src)">
    <img src="https://picsum.photos/id/1025/400/300" onclick="openLightbox(this.src)">
    <img src="https://picsum.photos/id/1035/400/300" onclick="openLightbox(this.src)">
    <img src="https://picsum.photos/id/1039/400/300" onclick="openLightbox(this.src)">
    <img src="https://picsum.photos/id/1043/400/300" onclick="openLightbox(this.src)">
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="close">&times;</span>
    <img id="lightbox-img">
</div>

<script>
    function openLightbox(src) {
        document.getElementById("lightbox").style.display = "block";
        document.getElementById("lightbox-img").src = src;
    }

    function closeLightbox() {
        document.getElementById("lightbox").style.display = "none";
    }
</script>

</body>
</html>
