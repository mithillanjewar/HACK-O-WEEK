<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Book Search</title>
    <meta name="description" content="A hyper-fast, binary-search enabled contact book application with a stunning UI.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-decor"></div>
    <div class="container">
        <header>
            <h1>Contacts</h1>
            <p>Perform hyper-fast binary searches on your contacts.</p>
        </header>

        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search by name (Binary Search)...">
            </div>
            <button id="addBtn" class="btn btn-primary"><i class="fas fa-plus"></i> New</button>
        </div>

        <div class="status-bar" id="statusBar">
            Contacts loaded and sorted. O(log n) search ready.
        </div>

        <div class="contacts-grid" id="contactsGrid">
            <!-- Contact cards will be rendered here -->
        </div>
    </div>

    <!-- Add Contact Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Contact</h2>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="newName">Full Name</label>
                    <input type="text" id="newName" placeholder="e.g. John Doe">
                </div>
                <div class="form-group">
                    <label for="newPhone">Phone Number</label>
                    <input type="text" id="newPhone" placeholder="e.g. +1 234 567 8900">
                </div>
                <div class="form-group">
                    <label for="newEmail">Email Address</label>
                    <input type="email" id="newEmail" placeholder="e.g. john@example.com">
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveContactBtn" class="btn btn-primary">Save Contact</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
