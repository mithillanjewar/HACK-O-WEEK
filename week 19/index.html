<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shume Playlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Shume Playlist</h1>

    <div class="container">
        <div class="controls">
            <input type="text" id="songName" placeholder="Song Name" />
            <input type="text" id="artistName" placeholder="Artist" />
            <button id="addFrontBtn">Add to Front</button>
            <button id="addEndBtn">Add to End</button>
        </div>
        
        <div class="controls">
            <input type="number" id="deletePos" placeholder="Position (1-indexed)" min="1" />
            <button id="deleteBtn" class="delete">Delete by Pos</button>
            <button id="reverseBtn" class="shuffle">Shuffle (Reverse)</button>
        </div>

        <div class="playlist-viz" id="playlistContainer">
            <!-- Nodes will be inserted here -->
            <div class="empty-state">Playlist is empty. Add some songs!</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
